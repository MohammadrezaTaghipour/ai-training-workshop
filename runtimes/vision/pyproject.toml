[project]
name = "ai-lab-vision"
version = "0.1.0"
description = "Isolated Ultralytics / YOLO runtime for the AI Learning Lab"
requires-python = ">=3.14"
dependencies = [
    "ultralytics>=8.4.147",
]

[project.scripts]
ai-lab-vision = "worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
